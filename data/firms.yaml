# Generated from data/firms.json (same content). Rules change: verify with the firm.
schemaVersion: 1
name: prop-firm-rules
lastVerified: '2026-10-04'
license: MIT
homepage: https://floorguard-kappa.vercel.app/tools/drawdown-calculator.html
disclaimer: Prop firms change rules often and many let you choose different percentages at checkout. Each value was read on
  the cited page on lastVerified (unless verified=false). Your firm's dashboard and current terms are the source of truth.
  Not affiliated with any firm. Not financial advice.
vocabulary:
- 'dailyLoss.amountBase: ''initial'' = % of initial balance; ''reference'' = % of the day-start reference value. dailyLoss.reference:
  ''balance'' = day-start balance; ''max'' = higher of day-start balance and day-start equity.'
- 'maxDrawdown.mode: ''static'' = floor fixed at initial - amount; ''trailing_eod'' = floor trails the highest end-of-day
  balance; ''trailing_closed'' = floor trails the highest closed (realised) balance; ''trailing_intraday'' = floor trails
  the peak balance including open profit. lockAt = floor stops trailing once it reaches initial + lockAt (null = never locks
  in this program).'
